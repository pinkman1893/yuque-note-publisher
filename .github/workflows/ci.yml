name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and CLI tests (no Yuque network access)
        run: python -m unittest discover -s tests -v
      - name: Validate example navigation
        run: yuque-homepage --repo examples/notes --check
      - name: Check public sources and documentation links
        run: python tools/check_project.py
